<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free-Hand Air Writing and Character Recognition</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--accent:#00f5a0;--dark:#242424}
*{box-sizing:border-box}body{margin:0;background:#202020;color:#f7f7f7;font-family:Arial,sans-serif}
.topbar{height:100px;background:#505050;display:flex;align-items:center;justify-content:space-around;gap:12px;padding:8px 16px}
.logo{width:92px;height:82px;object-fit:contain}.tool{height:76px;min-width:78px;border:3px solid transparent;border-radius:14px;background:transparent;color:white;font-size:38px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tool.active{border-color:#b6ffc9;background:#ffffff18}.tool.erase{font-size:40px}.tool.clear{background:#f00;border-radius:25px;font-size:42px;width:92px;height:82px}
.instructions{background:#555;color:#00ffff;font: bold 17px monospace;padding:5px 12px}.mode-status{color:#00ff00}
.workspace{position:relative;width:100%;height:calc(100vh - 160px);min-height:440px;background:#777;overflow:hidden}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#555}
#drawCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#cameraBtn{position:absolute;right:14px;top:14px;z-index:5;background:#222d;color:#fff;border:1px solid #ddd;border-radius:8px;padding:8px 12px}
#resultPanel{position:absolute;left:12px;bottom:12px;z-index:5;background:#222d;border:1px solid #aaa;border-radius:8px;padding:8px 12px;font-size:14px}
#result{color:#00ff00;font-weight:bold;font-size:20px}#mode{background:#333;color:white;border:1px solid #aaa;border-radius:5px;padding:4px}
@media(max-width:650px){.topbar{height:78px;padding:4px;gap:3px}.logo{width:45px;height:48px}.tool{min-width:42px;height:52px;font-size:25px}.tool.clear{width:54px;height:52px;font-size:28px}.workspace{height:calc(100vh - 138px)}.instructions{font-size:12px}}
</style></head><body>
<header class="topbar">
<img class="logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="Project logo" onerror="this.style.display='none'">
<button class="tool active" data-color="#ff2020" title="Red pen" aria-label="Red pen">🖌️</button>
<button class="tool" data-color="#ffe600" title="Yellow pen" aria-label="Yellow pen">🖌️</button>
<button class="tool" data-color="#00d45a" title="Green pen" aria-label="Green pen">🖌️</button>
<button class="tool" data-color="#265dff" title="Blue pen" aria-label="Blue pen">🖌️</button>
<button class="tool erase" id="eraserBtn" title="Eraser" aria-label="Eraser">🧽</button>
<button class="tool clear" id="clearOverlayBtn" title="Clear canvas" aria-label="Clear canvas">✖</button>
</header>
<div class="instructions">Raise index finger to draw · Two fingers to pause · Open palm to clear · Point at ✓ to recognize
<div class="mode-status">RECOGNITION MODE: <select id="mode"><option value="alphabet">ALPHABETS</option><option value="number">DIGITS</option></select></div></div>
<main class="workspace" id="workspace">
<video id="camera" autoplay playsinline muted></video>
<canvas id="drawCanvas" width="1280" height="720" aria-label="Air writing canvas"></canvas>
<button id="cameraBtn">Start camera</button>
<button class="tool" id="recognizeOverlayBtn" style="position:absolute;z-index:5;left:12px;bottom:12px;background:#00ff00;color:#111;border-radius:10px;padding:5px 14px;font-size:18px;font-weight:bold;width:auto;height:44px">✓ Recognize</button>
<div id="resultPanel">PREDICTION: <span id="result">—</span> <span id="confidence"></span><div id="status">Start camera to begin.</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="{{ url_for('static', filename='browser.js') }}"></script>
</body></html>
