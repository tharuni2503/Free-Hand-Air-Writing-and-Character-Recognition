<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free-Hand Air Writing and Character Recognition</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--accent:#00f5a0;--dark:#242424}
*{box-sizing:border-box}body{margin:0;background:#202020;color:#f7f7f7;font-family:Arial,sans-serif}
.topbar{min-height:104px;background:#252c38;border-bottom:1px solid #465164;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 18px;flex-wrap:wrap}
.logo{width:70px;height:66px;object-fit:contain}.tool{height:68px;min-width:100px;border:2px solid #566174;border-radius:12px;background:#303a49;color:white;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:7px;align-items:center;justify-content:center;cursor:pointer}.swatch{display:block;width:32px;height:8px;border-radius:8px;background:var(--swatch)}.tool-label{font-size:13px;letter-spacing:.02em}
.tool.active{border-color:#00f5a0;background:#354a4b}.tool.erase{font-size:14px}.tool.clear{background:#9d2634;border-color:#e35a6a;border-radius:12px;font-size:14px;width:100px;height:68px}
.instructions{background:#18202c;color:#c5d2e4;font:600 13px/1.6 Arial,sans-serif;padding:10px 18px;border-bottom:1px solid #3b4657}.mode-status{color:#00f5a0}
.workspace{position:relative;width:100%;height:calc(100vh - 160px);min-height:440px;background:#777;overflow:hidden}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#555}
#drawCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#cameraBtn{position:absolute;right:14px;top:14px;z-index:5;background:#222d;color:#fff;border:1px solid #ddd;border-radius:8px;padding:8px 12px}
#resultPanel{position:absolute;left:12px;bottom:12px;z-index:5;background:#222d;border:1px solid #aaa;border-radius:8px;padding:8px 12px;font-size:14px}
#result{color:#00ff00;font-weight:bold;font-size:24px}#mode{background:#333;color:white;border:1px solid #aaa;border-radius:5px;padding:4px}.tool.gesture-hover{outline:3px solid #00f5a0;background:#40505c;box-shadow:0 0 18px #00f5a077}.tool{transition:background .15s,box-shadow .15s,outline .15s}.mode-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#resultPanel{max-width:min(460px,calc(100% - 24px));backdrop-filter:blur(8px);line-height:1.45}#status{font-size:12px;color:#d8e5e5;margin-top:3px}
@media(max-width:650px){.topbar{padding:8px;gap:6px}.logo{width:38px;height:42px}.tool{min-width:72px;height:58px;font-size:12px}.swatch{width:24px}.tool.clear{width:72px;height:58px;font-size:12px}.workspace{height:calc(100vh - 210px)}.instructions{font-size:11px;padding:8px}}
</style></head><body>
<header class="topbar">
<img class="logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="Project logo" onerror="this.style.display='none'">
<button class="tool active" data-color="#ff2020" title="Select red pen" aria-label="Red pen"><span class="swatch" style="--swatch:#ff2020"></span><span class="tool-label">RED</span></button>
<button class="tool" data-color="#ffe600" title="Select yellow pen" aria-label="Yellow pen"><span class="swatch" style="--swatch:#ffe600"></span><span class="tool-label">YELLOW</span></button>
<button class="tool" data-color="#00d45a" title="Select green pen" aria-label="Green pen"><span class="swatch" style="--swatch:#00d45a"></span><span class="tool-label">GREEN</span></button>
<button class="tool" data-color="#265dff" title="Select blue pen" aria-label="Blue pen"><span class="swatch" style="--swatch:#265dff"></span><span class="tool-label">BLUE</span></button>
<button class="tool erase" id="eraserBtn" title="Select eraser" aria-label="Eraser"><span class="swatch" style="--swatch:#d5dce6"></span><span class="tool-label">ERASER</span></button>
<button class="tool clear" id="clearOverlayBtn" title="Clear canvas" aria-label="Clear canvas"><span class="tool-label">CLEAR ALL</span></button>
</header>
<div class="instructions">HANDS-FREE CONTROLS: Index finger = draw · Hold index + middle = recognize · Open palm = clear · Point at a labelled toolbar control to select
<div class="mode-status">RECOGNITION MODE: <select id="mode"><option value="alphabet">ALPHABETS</option><option value="number">DIGITS</option></select></div></div>
<main class="workspace" id="workspace">
<video id="camera" autoplay playsinline muted></video>
<canvas id="drawCanvas" width="1280" height="720" aria-label="Air writing canvas"></canvas>
<button id="cameraBtn">Start camera</button>
<button class="tool" id="recognizeOverlayBtn" style="position:absolute;z-index:5;left:12px;bottom:12px;background:#00f5a0;color:#102019;border-radius:10px;padding:5px 14px;font-size:14px;font-weight:bold;width:auto;height:44px;min-width:130px">RECOGNIZE</button>
<div id="resultPanel">PREDICTION: <span id="result">—</span> <span id="confidence"></span><div id="status">Start camera to begin.</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="{{ url_for('static', filename='browser.js') }}"></script>
</body></html>
